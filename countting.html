<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var n=0;
        var loop; 
    
     function startcount()
     {
        loop=setInterval(f,1000);
        document .querySelector("#stop").disabled=true; 
     }
     function f()
     {
        n++;
        document.querySelector("#count").innerHTML=n;
        if(n==10)
        {
            clearInterval(loop);
            document.querySelector("#stop").disabled=false;
            alert("counting stopped");
        }

     }
        function stopcount()
        {
            clearInterval(loop);
        }
    </script>
      
    outup:<div id="count"></div><br/>

 <input type="button" value="Start counting" id="stop" onclick="startcount()"><br/>   
 <input type="button" value="Stop counting" onclick="stopcount()"><br/> 

    
     
</body>
</html>
